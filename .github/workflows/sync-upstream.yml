name: Sync upstream with macOS 15 patch

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/NotProtonNot/NotProton.git || true

      - name: Fetch upstream
        run: |
          git fetch upstream

      - name: Rebuild clean-macos15 branch
        run: |
          git checkout clean-macos15
          git reset --hard upstream/main
          git cherry-pick 0a1a625

      - name: Push update
        run: |
          git push origin clean-macos15 --force
