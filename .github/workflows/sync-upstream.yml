name: Sync upstream and build

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Save workflows
        run: |
          mkdir -p /tmp/workflows
          cp -r .github/workflows /tmp/workflows/

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/NotProtonNot/NotProton.git || true
          git fetch upstream
          git fetch origin

      - name: Update main and apply macOS patch
        run: |
          git checkout main
          git reset --hard upstream/main
          git cherry-pick origin/macos15-patch

      - name: Restore workflows
        run: |
          mkdir -p .github
          cp -r /tmp/workflows/workflows .github/

      - name: Commit workflow files
        run: |
          git add .github/workflows

          if ! git diff --cached --quiet; then
            git commit -m "Keep automation workflows"
          fi

      - name: Push main
        run: |
          git push origin main --force-with-lease

      - name: Start app.yml
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "app.yml",
              ref: "main"
            })
