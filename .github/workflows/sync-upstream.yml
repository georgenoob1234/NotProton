name: Sync upstream and rebuild macOS 15

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/NotProtonNot/NotProton.git || true
          git fetch upstream
          git fetch origin

      - name: Reapply macOS patch
        run: |
          git checkout clean-macos15
          git reset --hard upstream/main
          git cherry-pick origin/macos15-patch

      - name: Push
        run: |
          git push origin clean-macos15 --force-with-lease
